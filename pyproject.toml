[build-system]
# Build against NumPy 2 headers: the resulting binaries stay ABI-compatible with
# NumPy 1.19.5+ runtimes (Blender 4.5) as well as NumPy 2.x (Blender 5.x, CI).
# Pinned so the ABI baseline is reproducible; 2.1.3 ships wheels for every
# target Python and platform, so no build ever falls back to a NumPy sdist.
requires = [
    "setuptools>=45",
    "wheel",
    "Cython>=3.0.0",
    "numpy==2.1.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyufbx"
dynamic = ["version"]
description = "Python bindings for ufbx - Single source file FBX loader"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "ufbx-python contributors"}
]
keywords = ["fbx", "3d", "graphics", "modeling", "autodesk", "loader"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/popomore/ufbx-python"
Repository = "https://github.com/popomore/ufbx-python"
Issues = "https://github.com/popomore/ufbx-python/issues"
Documentation = "https://github.com/popomore/ufbx-python#readme"

[tool.setuptools.dynamic]
version = {attr = "ufbx.__version__"}

# =============================================================================
# cibuildwheel Configuration
# =============================================================================
[tool.cibuildwheel]
# Blender 4.5 ships Python 3.11; Blender 5.x ships Python 3.13.
build = "cp311-* cp313-*"
skip = "*-musllinux_*"
# importlib mode keeps the checkout off sys.path so tests exercise the
# installed wheel rather than the unbuilt ufbx/ source package.
test-command = "pytest --import-mode=importlib {project}/tests -q"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# NumPy ships manylinux_2_28 wheels from 2.2 on, so the default manylinux2014
# image cannot install Blender 5.x's NumPy without a source build its GCC 10.2
# is too old for. Blender itself requires glibc 2.28+, so this costs nothing.
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# Test each wheel against the NumPy that its target Blender actually bundles.
[[tool.cibuildwheel.overrides]]
select = "cp311-*"
test-requires = ["pytest", "numpy==1.26.4"]

[[tool.cibuildwheel.overrides]]
select = "cp313-*"
test-requires = ["pytest", "numpy==2.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["ufbx"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py39"
line-length = 127
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports

[tool.ruff.isort]
known-first-party = ["ufbx"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.1.0",
    "setuptools>=45",
    "wheel",
    "Cython>=3.0.0",
    "numpy>=1.20.0",
    "build>=1.0.0",
    "ruff>=0.1.0",
]
